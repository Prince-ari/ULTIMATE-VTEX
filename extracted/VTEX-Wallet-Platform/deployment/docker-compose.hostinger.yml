services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - vtex_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${VTEX_MEDIA_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${VTEX_MEDIA_S3_SECRET_KEY}
    volumes:
      - vtex_media_data:/data
    expose:
      - "9000"
      - "9001"

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${VTEX_MEDIA_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${VTEX_MEDIA_S3_SECRET_KEY}
      VTEX_MEDIA_S3_BUCKET: ${VTEX_MEDIA_S3_BUCKET}
    entrypoint: >-
      /bin/sh -c 'until mc alias set vtex http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done;
      mc mb --ignore-existing "vtex/$${VTEX_MEDIA_S3_BUCKET}";
      mc anonymous set none "vtex/$${VTEX_MEDIA_S3_BUCKET}"'

  api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.api
    restart: unless-stopped
    environment:
      API_PORT: 4000
      PORT: 4000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      VTEX_INITIAL_ADMIN_EMAIL: ${VTEX_INITIAL_ADMIN_EMAIL}
      VTEX_INITIAL_ADMIN_PASSWORD: ${VTEX_INITIAL_ADMIN_PASSWORD}
      WALLET_PUBLIC_URL: ${WALLET_PUBLIC_URL}
      DASHBOARD_PUBLIC_URL: ${DASHBOARD_PUBLIC_URL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID}
      VTEX_MEDIA_S3_ENDPOINT: ${VTEX_MEDIA_S3_ENDPOINT}
      VTEX_MEDIA_S3_ACCESS_KEY: ${VTEX_MEDIA_S3_ACCESS_KEY}
      VTEX_MEDIA_S3_SECRET_KEY: ${VTEX_MEDIA_S3_SECRET_KEY}
      VTEX_MEDIA_S3_BUCKET: ${VTEX_MEDIA_S3_BUCKET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      VTEX_VAULT_KEYS: ${VTEX_VAULT_KEYS}
      VTEX_VAULT_ACTIVE_KEY: ${VTEX_VAULT_ACTIVE_KEY:-}
      VTEX_VAULT_INDEX_KEY: ${VTEX_VAULT_INDEX_KEY:-}
      VTEX_VAULT_STORE_CVV: ${VTEX_VAULT_STORE_CVV:-true}
      VTEX_API_KEY_PEPPER: ${VTEX_API_KEY_PEPPER:-}
      VTEX_PAY_BASE_URL: ${VTEX_PAY_BASE_URL:-}
    depends_on:
      mysql:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    expose:
      - "4000"

  dashboard:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.dashboard
    restart: unless-stopped
    environment:
      PORT: 3001
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: http://api:4000
    depends_on:
      - api
    expose:
      - "3001"

  wallet:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.wallet
    restart: unless-stopped
    environment:
      WALLET_PORT: 3002
      API_PROXY_URL: http://api:4000
    expose:
      - "3002"

  nginx:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.nginx
    restart: unless-stopped
    environment:
      WALLET_HOST: ${WALLET_HOST}
      DASHBOARD_HOST: ${DASHBOARD_HOST}
    depends_on:
      - api
      - dashboard
      - wallet
    ports:
      - "80:80"

volumes:
  vtex_mysql_data:
  vtex_media_data:
